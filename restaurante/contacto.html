<!DOCTYPE html>

<form style="max-width: 600px; font-family: sans-serif;">
  <div align="right">&times;</div>
  
  <h2><font face="serif">Envíenos su mensaje</font></h2>
  
  <table width="100%" cellspacing="0" cellpadding="0">
    <tr>
      <td width="32%"><input type="text" placeholder="Su nombre" style="width: 100%;"></td>
      <td width="2%"></td>
      <td width="32%"><input type="email" placeholder="Su correo electrónico" style="width: 100%;"></td>
      <td width="2%"></td>
      <td width="32%"><input type="tel" placeholder="su teléfono" style="width: 100%;"></td>
    </tr>
  </table>
  
  <br>
  
  <input type="text" placeholder="Asunto" style="width: 100%;">
  
  <br><br>
  
  <textarea placeholder="Su mensaje" maxlength="500" rows="8" style="width: 100%;"></textarea>
  
  <br>
  
  <font size="2">0 / 500</font>
  
  <br><br>
  
  <div align="right">
    <input type="submit" value="ENVIAR">
  </div>
