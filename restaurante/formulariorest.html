<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Alejandro">
    <meta name="description" content="Formulario de reserva para el restaurante">
    <meta name="keywords" content="reserva, restaurante, mesa">
    <title>Reserva - Restaurante</title>
</head>
<body>
    <header>
        <!-- Enlace para volver a la página principal del restaurante -->
        <a href="index.html">Volver al menu principal del restaurante</a>
    </header>
   
    <nav>
        <!-- Aquí iría la navegación principal -->
    </nav>

    <main>
        <h2>Haz una reserva</h2>
        <form action="#" method="POST">
            <div>
                <label for="nombre">Su nombre</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
           
            <div>
                <label for="clientes">Número de clientes</label>
                <input type="number" id="clientes" name="clientes" required>
            </div>
           
            <div>
                <label for="correo">Su correo electrónico</label>
                <input type="email" id="correo" name="correo" required>
            </div>
           
            <div>
                <label for="telefono">su teléfono</label>
                <input type="tel" id="telefono" name="telefono" required>
            </div>
           
            <div>
                <label for="fecha">Fecha de la reserva</label>
                <input type="date" id="fecha" name="fecha" required>
            </div>
           
            <div>
                <label for="hora">Hora de la reserva</label>
                <input type="time" id="hora" name="hora" required>
            </div>
           
            <div>
                <label for="mensaje">Su mensaje</label>
                <textarea id="mensaje" name="mensaje" rows="4"></textarea>
            </div>

            <button type="submit">SOLICITAR RESERVA</button>
            <p>Si desea saber cómo protegemos sus datos, consulte nuestra <a href="#">Política de privacidad</a></p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Restaurante Patio Andaluz</p>
    </footer>
</body>
</html>
